<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5cbcf0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Svolazzo 3D</title>
<style>
  /* ================= BASE ================= */
  :root{
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --ink:#3b2410;
    --font:"Trebuchet MS","Arial Rounded MT Bold","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; position:fixed; inset:0;
    background:#8fd8f8;
    touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    font-family:var(--font); color:#fff;
  }
  #game{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #ui{ position:fixed; inset:0; pointer-events:none; z-index:2; }
  button{ pointer-events:auto; font-family:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  button:focus{ outline:none; }
  button:focus-visible{ outline:3px solid #fff; outline-offset:3px; }

  /* Contorno del testo stile cartoon (compatibile ovunque) */
  .ol{
    text-shadow:
      .06em 0 0 var(--ink), -.06em 0 0 var(--ink), 0 .06em 0 var(--ink), 0 -.06em 0 var(--ink),
      .045em .045em 0 var(--ink), -.045em .045em 0 var(--ink), .045em -.045em 0 var(--ink), -.045em -.045em 0 var(--ink),
      0 .12em 0 var(--ink);
  }

  /* ================= HUD ================= */
  #score{
    position:absolute; left:0; right:0; top:calc(var(--sat) + 5.5vh);
    text-align:center; font-size:clamp(52px,13vmin,104px); font-weight:900; line-height:1;
    font-variant-numeric:tabular-nums; opacity:0; transition:opacity .2s;
  }
  #score.show{ opacity:1; }
  #score.pop{ animation:pop .18s ease-out; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.22)} 100%{transform:scale(1)} }

  #topbar{
    position:absolute; top:calc(var(--sat) + 10px); right:calc(var(--sar) + 10px);
    display:flex; gap:10px; z-index:5;
  }
  .icon-btn{
    width:50px; height:50px; border-radius:50%; padding:0;
    border:3px solid var(--ink); background:rgba(255,255,255,.88); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 var(--ink); transition:transform .06s, box-shadow .06s, opacity .2s;
  }
  .icon-btn svg{ width:26px; height:26px; display:block; }
  .icon-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .icon-btn.off{ opacity:.55; }
  #btnPause{ position:absolute; top:calc(var(--sat) + 10px); left:calc(var(--sal) + 10px); z-index:5; display:none; }
  #btnPause.show{ display:flex; }
  @media (max-width:400px){
    .icon-btn{ width:44px; height:44px; }
    .icon-btn svg{ width:22px; height:22px; }
    #topbar{ gap:8px; }
  }

  /* ================= SCHERMATE ================= */
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:calc(var(--sat) + 20px) calc(var(--sar) + 20px) calc(var(--sab) + 20px) calc(var(--sal) + 20px);
    text-align:center; opacity:0; visibility:hidden;
    transition:opacity .25s ease, visibility 0s linear .25s;
  }
  .screen.show{ opacity:1; visibility:visible; transition:opacity .25s ease, visibility 0s; }

  /* Menu */
  #menu{ justify-content:space-between; padding-top:calc(var(--sat) + max(9vh, 78px)); padding-bottom:calc(var(--sab) + 7vh); }
  .title{
    margin:0; font-size:clamp(46px,13vmin,96px); font-weight:900; color:#ffd23f; line-height:.95;
    letter-spacing:.01em; animation:float 2.6s ease-in-out infinite;
  }
  .title small{ display:block; font-size:.46em; color:#fff; margin-top:.15em; letter-spacing:.25em; }
  @keyframes float{ 0%,100%{transform:rotate(-3deg) translateY(0)} 50%{transform:rotate(-3deg) translateY(-8px)} }
  .menu-bottom{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .best{ font-size:22px; font-weight:800; }
  .hint{ font-size:15px; font-weight:700; opacity:.95; max-width:300px; line-height:1.3;
         text-shadow:0 1px 0 var(--ink), 0 0 6px rgba(0,0,0,.35); }

  /* Pulsanti grandi */
  .btn{
    min-width:200px; min-height:62px; padding:12px 34px; border-radius:18px;
    border:4px solid var(--ink); background:linear-gradient(#ffbb45,#ff8a1f); color:#fff;
    font-size:28px; font-weight:900; letter-spacing:.03em;
    box-shadow:0 6px 0 var(--ink); text-shadow:0 2px 0 rgba(59,36,16,.75);
    transition:transform .06s, box-shadow .06s, opacity .25s, filter .25s;
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  .btn.green{ background:linear-gradient(#86e35f,#3fb33a); }
  .btn.small{ min-width:0; min-height:56px; font-size:20px; padding:10px 22px; background:linear-gradient(#ffffff,#e5dcc2); color:var(--ink); text-shadow:none; }
  .btn:disabled{ opacity:.45; filter:grayscale(.5); pointer-events:none; }

  /* Pronto */
  #ready{ justify-content:space-between; padding-top:calc(var(--sat) + 19vh); padding-bottom:calc(var(--sab) + 13vh); }
  .big-label{ margin:0; font-size:clamp(38px,10vmin,72px); font-weight:900; color:#ffd23f; }
  .tap{ display:flex; flex-direction:column; align-items:center; gap:8px; font-size:clamp(22px,6.2vmin,34px); font-weight:900; }
  .tap svg{ width:70px; height:70px; overflow:visible; }
  .tap .ring{ transform-origin:32px 32px; animation:ring 1.1s ease-out infinite; }
  .tap .dot{ transform-origin:32px 32px; animation:dot 1.1s ease-in-out infinite; }
  @keyframes ring{ 0%{transform:scale(.5); opacity:1} 100%{transform:scale(1.35); opacity:0} }
  @keyframes dot{ 0%,100%{transform:scale(1)} 15%{transform:scale(.8)} 35%{transform:scale(1.05)} }

  /* Game over */
  #gameover{ gap:22px; }
  #gameover .go-title{ transform:translateY(-30px); opacity:0; transition:transform .4s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  #gameover .panel{ transform:translateY(50px); opacity:0; transition:transform .45s cubic-bezier(.2,1.3,.4,1) .12s, opacity .3s .12s; }
  #gameover.show .go-title, #gameover.show .panel{ transform:none; opacity:1; }
  .panel{
    background:#fbeec1; border:4px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink);
    padding:16px 22px; display:flex; gap:22px; align-items:center; justify-content:space-between;
    color:var(--ink); width:min(360px, 88vw);
  }
  .medal-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; min-width:90px; }
  .lbl{ font-size:14px; font-weight:900; color:#c0622b; text-transform:uppercase; letter-spacing:.06em; }
  .medal{
    width:74px; height:74px; border-radius:50%; position:relative;
    display:flex; align-items:center; justify-content:center; font-size:36px; color:rgba(255,255,255,.95);
    box-shadow:inset 0 -6px 0 rgba(0,0,0,.18), 0 3px 0 rgba(59,36,16,.45);
    border:3px solid rgba(59,36,16,.55);
  }
  .medal::after{ content:"\2605"; text-shadow:0 2px 0 rgba(0,0,0,.25); }
  .medal.none{ background:#e4d4a4; box-shadow:inset 0 4px 8px rgba(0,0,0,.18); border-color:rgba(59,36,16,.25); }
  .medal.none::after{ content:""; }
  .medal.bronze{ background:radial-gradient(circle at 35% 30%,#f6c08a,#b5692b 72%); }
  .medal.silver{ background:radial-gradient(circle at 35% 30%,#ffffff,#a8b3be 72%); }
  .medal.gold{ background:radial-gradient(circle at 35% 30%,#fff7b5,#e3a600 72%); }
  .medal.platinum{ background:radial-gradient(circle at 35% 30%,#ffffff,#bfe2f2 50%,#86aec6 82%); }
  .medal.reveal{ animation:medalIn .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes medalIn{ 0%{transform:scale(0) rotate(-90deg)} 100%{transform:scale(1) rotate(0)} }
  .medal-name{ font-size:15px; font-weight:900; min-height:1.2em; }
  .scores{ display:flex; flex-direction:column; gap:10px; text-align:right; flex:1; }
  .srow{ display:flex; flex-direction:column; align-items:flex-end; }
  .val{ font-size:38px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; color:#fff; }
  #newBadge{
    display:inline-block; font-style:normal; background:#ff4d4d; color:#fff; border-radius:6px; padding:1px 6px;
    font-size:12px; margin-right:4px; transform:scale(0); transition:transform .3s cubic-bezier(.2,1.8,.4,1);
  }
  #newBadge.show{ transform:scale(1); }
  .row{ display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap; }

  /* Pausa */
  #pause{ background:rgba(10,30,60,.38); }
  #countdown{ font-size:clamp(70px,22vmin,150px); font-weight:900; min-height:1em; line-height:1; }
  #pause.counting #btnResume{ display:none; }

  /* Effetti */
  #flash{ position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.on{ animation:flash .38s ease-out; }
  @keyframes flash{ 0%{opacity:.95} 100%{opacity:0} }
  #toast{
    position:absolute; left:50%; bottom:calc(var(--sab) + 22px); transform:translate(-50%,20px);
    background:rgba(30,20,10,.82); color:#fff; padding:10px 16px; border-radius:12px;
    font-size:15px; font-weight:700; opacity:0; transition:opacity .3s, transform .3s; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translate(-50%,0); }

  #loading{
    position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center;
    background:linear-gradient(#3f9be6,#bfe9ff); font-size:22px; font-weight:800; text-align:center; padding:24px;
    transition:opacity .4s, visibility 0s linear .4s;
  }
  #loading.hide{ opacity:0; visibility:hidden; }
  #loading .spin{ width:44px; height:44px; border-radius:50%; border:5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .9s linear infinite; }
  #loading.error .spin{ display:none; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Schermi bassi (smartphone in orizzontale) */
  @media (max-height:520px){
    #score{ top:calc(var(--sat) + 3vh); font-size:56px; }
    #menu{ padding-top:calc(var(--sat) + 4vh); padding-bottom:calc(var(--sab) + 4vh); }
    .title{ font-size:46px; }
    .menu-bottom{ gap:8px; }
    .hint{ display:none; }
    #ready{ padding-top:calc(var(--sat) + 8vh); padding-bottom:calc(var(--sab) + 8vh); }
    #gameover{ gap:10px; }
    .big-label{ font-size:40px; }
    .panel{ padding:10px 18px; }
    .medal{ width:60px; height:60px; font-size:28px; }
    .val{ font-size:30px; }
    .btn{ min-height:52px; font-size:22px; padding:8px 26px; min-width:160px; }
    .btn.small{ min-height:48px; font-size:18px; }
  }
  @media (prefers-reduced-motion:reduce){
    .title{ animation:none; }
    #flash.on{ animation-duration:.25s; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Area di gioco"></canvas>

<div id="ui">
  <div id="flash"></div>
  <div id="score" class="ol">0</div>

  <button id="btnPause" class="icon-btn" aria-label="Pausa">
    <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2" fill="currentColor"/></svg>
  </button>
  <div id="topbar">
    <button id="btnShadows" class="icon-btn" aria-label="Ombre">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button id="btnSound" class="icon-btn" aria-label="Audio"></button>
  </div>

  <section id="menu" class="screen">
    <h1 class="title ol">Svolazzo<small>3D</small></h1>
    <div class="menu-bottom">
      <button id="btnPlay" class="btn">Gioca</button>
      <div class="best ol">Record: <span id="menuBest">0</span></div>
      <div class="hint">Tocca lo schermo, clicca o premi <b>Spazio</b> per battere le ali</div>
    </div>
  </section>

  <section id="ready" class="screen">
    <h2 class="big-label ol">Preparati!</h2>
    <div class="tap ol">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring" cx="32" cy="32" r="24" fill="none" stroke="#fff" stroke-width="4"/>
        <circle class="dot" cx="32" cy="32" r="11" fill="#fff" stroke="#3b2410" stroke-width="4"/>
      </svg>
      <span>Tocca per volare</span>
    </div>
  </section>

  <section id="gameover" class="screen">
    <h2 class="big-label ol go-title">Game Over</h2>
    <div class="panel">
      <div class="medal-wrap">
        <span class="lbl">Medaglia</span>
        <div id="medal" class="medal none"></div>
        <span id="medalName" class="medal-name">&mdash;</span>
      </div>
      <div class="scores">
        <div class="srow"><span class="lbl">Punteggio</span><span id="goScore" class="val ol">0</span></div>
        <div class="srow"><span class="lbl"><em id="newBadge">NUOVO!</em>Record</span><span id="goBest" class="val ol">0</span></div>
      </div>
    </div>
    <div class="row">
      <button id="btnRetry" class="btn green">Rigioca</button>
      <button id="btnMenu" class="btn small">Menu</button>
    </div>
  </section>

  <section id="pause" class="screen">
    <h2 class="big-label ol">Pausa</h2>
    <button id="btnResume" class="btn green">Riprendi</button>
    <div id="countdown" class="ol"></div>
  </section>

  <div id="toast" role="status"></div>
</div>

<div id="loading"><div class="spin"></div><div id="loadingText">Caricamento&hellip;</div></div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#3f9be6;color:#fff;font:700 20px sans-serif;z-index:20">Per giocare serve JavaScript.</div></noscript>

<script type="module">
// ============================================================
//  CONFIGURAZIONE — modifica qui per cambiare difficoltà e resa
// ============================================================
const CONFIG = {
  // --- Fisica ---
  GRAVITY: 28,              // gravità (unità/s²)
  FLAP_IMPULSE: 8.5,        // velocità verso l'alto impostata dal battito (unità/s), NON si somma
  MAX_FALL_SPEED: 13,       // velocità massima di caduta (unità/s)
  FIXED_DT: 1 / 120,        // timestep fisso della simulazione (s)
  // --- Rotazione dell'uccello ---
  ROT_UP: 0.45,             // inclinazione verso l'alto dopo il battito (rad, ~26°)
  ROT_DOWN: -1.48,          // inclinazione massima in picchiata (rad, ~-85°)
  ROT_UP_SPEED: 14,         // velocità di rotazione verso l'alto (rad/s)
  ROT_DOWN_SPEED: 5.2,      // velocità di rotazione verso il basso (rad/s)
  ROT_DIVE_VY: -3.2,        // sotto questa velocità verticale inizia la picchiata
  // --- Tubi ---
  PIPE_SPEED: 3,            // velocità di scorrimento (unità/s)
  PIPE_GAP: 3.2,            // apertura verticale tra tubo basso e alto
  PIPE_SPACING: 4.5,        // distanza orizzontale tra coppie
  PIPE_RADIUS: 0.55,        // raggio del tubo
  PIPE_CAP_RADIUS: 0.7,     // raggio del "cappello"
  PIPE_CAP_HEIGHT: 0.45,    // altezza del "cappello"
  GAP_MARGIN_BOTTOM: 1.2,   // distanza minima apertura-terreno
  GAP_MARGIN_TOP: 1.3,      // distanza minima apertura-soffitto
  MAX_GAP_DELTA: 3.6,       // salto massimo di altezza tra aperture consecutive
  FIRST_PIPE_DISTANCE: 7.5, // distanza del primo tubo a inizio partita
  PIPE_POOL_SIZE: 14,       // coppie nel pool (riutilizzate, mai ricreate)
  // --- Mondo ---
  GROUND_Y: 0,              // quota del terreno
  CEILING_Y: 10,            // quota del soffitto
  BIRD_X: 0,                // posizione orizzontale fissa dell'uccello
  BIRD_START_Y: 5.2,        // quota iniziale
  BIRD_HITBOX: 0.3,         // raggio hitbox (il modello misura ~0.38)
  BOB_AMP: 0.18,            // ampiezza fluttuazione in menu/pronto
  BOB_HZ: 1.4,              // frequenza fluttuazione
  WING_FLAP_TIME: 0.22,     // durata di un colpo d'ala (s)
  WING_IDLE_HZ: 6,          // frequenza sbattimento "a riposo"
  // --- Ritmo / interfaccia ---
  GAMEOVER_PANEL_DELAY: 0.45, // attesa tra atterraggio e pannello (s)
  GAMEOVER_INPUT_LOCK: 0.5,   // tocchi ignorati dopo il pannello (s)
  DAY_NIGHT_EVERY: 15,        // giorno/notte ogni N punti (0 = disattivato)
  MEDALS: [
    { min: 40, id: 'platinum', name: 'Platino' },
    { min: 30, id: 'gold',     name: 'Oro' },
    { min: 20, id: 'silver',   name: 'Argento' },
    { min: 10, id: 'bronze',   name: 'Bronzo' },
  ],
  // --- Camera ---
  FOV: 50,                  // campo visivo verticale (gradi)
  CAM_PITCH_DEG: 5,         // inclinazione dall'alto
  CAM_YAW_DEG: 6,           // rotazione laterale
  VIEW_Y_MIN: -1.6,         // quota minima sempre visibile
  VIEW_Y_MAX: 10.8,         // quota massima sempre visibile
  VIEW_MIN_WIDTH: 7.2,      // larghezza minima visibile (schermi verticali)
  // --- Grafica ---
  MAX_PIXEL_RATIO: 2,       // limite devicePixelRatio
};

const THREE_URLS = [
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js', // riserva, stessa libreria
];
const KEY_BEST = 'svolazzo3d:best', KEY_MUTED = 'svolazzo3d:muted', KEY_SHADOWS = 'svolazzo3d:shadows';

// Valori derivati
const GAP_MIN_Y = CONFIG.GROUND_Y + CONFIG.GAP_MARGIN_BOTTOM + CONFIG.PIPE_GAP / 2;
const GAP_MAX_Y = CONFIG.CEILING_Y - CONFIG.GAP_MARGIN_TOP - CONFIG.PIPE_GAP / 2;
const GROUND_REST_Y = CONFIG.GROUND_Y + 0.42;   // quota dell'uccello a terra
const DIE_Z = 1.2;                              // cadendo si sposta davanti ai tubi
const PIPE_BOTTOM = CONFIG.GROUND_Y - 2;        // base dei tubi (dentro il terreno)
const PIPE_TOP = 40;                            // cima dei tubi alti (fuori schermo)

// ============================================================
//  UTILITÀ
// ============================================================
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const rand = (a, b) => a + Math.random() * (b - a);
const wrap = (v, span) => ((v % span) + span) % span - span / 2;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
function mulberry32(a) { // generatore pseudo-casuale con seme (scenario sempre uguale)
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const storage = {
  get(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* storage non disponibile */ } },
};
const $ = (id) => document.getElementById(id);

const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
const LOW_END = (navigator.hardwareConcurrency || 4) <= 2 || (navigator.deviceMemory !== undefined && navigator.deviceMemory <= 2);
const REDUCED_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ============================================================
//  AUDIO (Web Audio API, suoni sintetizzati)
// ============================================================
const Sfx = (() => {
  let ctx = null, master = null, noiseBuf = null, primed = false;
  let muted = storage.get(KEY_MUTED, '0') === '1';
  const VOL = 0.7;

  function ensure() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    const comp = ctx.createDynamicsCompressor();
    master = ctx.createGain();
    master.gain.value = muted ? 0 : VOL;
    master.connect(comp); comp.connect(ctx.destination);
    // buffer di rumore bianco riutilizzabile
    const len = Math.floor(ctx.sampleRate * 0.6);
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return ctx;
  }
  // Va chiamata dentro un gesto dell'utente (requisito iOS/Android)
  function unlock() {
    const c = ensure(); if (!c) return;
    if (c.state !== 'running') { try { const p = c.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    if (!primed) { // buffer muto: sblocca l'audio su iOS
      try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); primed = true; } catch (e) {}
    }
  }
  const ok = () => ctx && ctx.state === 'running' && !muted;

  function tone({ type = 'sine', f0, f1 = 0, t = 0, dur, vol, attack = 0.005 }) {
    const now = ctx.currentTime + t;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, now);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(master);
    o.start(now); o.stop(now + dur + 0.03);
  }
  function noise({ t = 0, dur, vol, type = 'bandpass', f0, f1 = 0, q = 1 }) {
    const now = ctx.currentTime + t;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf;
    f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, now);
    if (f1) f.frequency.exponentialRampToValueAtTime(f1, now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(vol, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(now); s.stop(now + dur + 0.03);
  }

  return {
    unlock,
    get state() { return ctx ? ctx.state : 'assente'; },
    get muted() { return muted; },
    setMuted(m) {
      muted = m; storage.set(KEY_MUTED, m ? '1' : '0');
      if (master) master.gain.setTargetAtTime(m ? 0 : VOL, ctx.currentTime, 0.02);
    },
    suspend() { if (ctx && ctx.state === 'running') { try { ctx.suspend().catch(() => {}); } catch (e) {} } },
    resume() { if (ctx && ctx.state !== 'running') { try { ctx.resume().catch(() => {}); } catch (e) {} } },
    flap() { if (!ok()) return;   // fruscio d'ala
      noise({ dur: 0.12, vol: 0.32, f0: 650, f1: 2600, q: 0.9 });
      tone({ type: 'sine', f0: 300, f1: 560, dur: 0.07, vol: 0.1 });
    },
    point() { if (!ok()) return;  // doppio rintocco
      tone({ type: 'triangle', f0: 1046, dur: 0.09, vol: 0.22 });
      tone({ type: 'triangle', f0: 1568, t: 0.075, dur: 0.24, vol: 0.2 });
      tone({ type: 'sine', f0: 3136, t: 0.075, dur: 0.12, vol: 0.04 });
    },
    hit() { if (!ok()) return;    // botta
      noise({ dur: 0.18, vol: 0.55, type: 'lowpass', f0: 2200, f1: 300, q: 0.7 });
      tone({ type: 'sine', f0: 190, f1: 45, dur: 0.24, vol: 0.7 });
      tone({ type: 'square', f0: 95, f1: 60, dur: 0.08, vol: 0.06 });
    },
    fall() { if (!ok()) return;   // caduta discendente
      tone({ type: 'triangle', f0: 900, f1: 150, dur: 0.62, vol: 0.17, attack: 0.02 });
      tone({ type: 'sine', f0: 450, f1: 80, dur: 0.62, vol: 0.08, attack: 0.02 });
    },
    swoosh() { if (!ok()) return; // transizione UI
      noise({ dur: 0.28, vol: 0.14, f0: 300, f1: 1900, q: 0.7 });
    },
  };
})();

const pipes = {
  list: [], lastX: 0, prevGap: null, visible: false, intro: 1,
  init() {
    for (let i = 0; i < CONFIG.PIPE_POOL_SIZE; i++) this.list.push({ x: 0, gapY: 5, scored: false });
  },
  nextGap() {
    let g = rand(GAP_MIN_Y, GAP_MAX_Y);
    if (this.prevGap !== null) g = clamp(g, this.prevGap - CONFIG.MAX_GAP_DELTA, this.prevGap + CONFIG.MAX_GAP_DELTA);
    this.prevGap = g;
    return g;
  },
  // Riposiziona tutte le coppie davanti all'uccello (nessuna allocazione)
  reset(scrollNow) {
    this.prevGap = null;
    this.list.forEach((p, i) => {
      p.x = scrollNow + CONFIG.FIRST_PIPE_DISTANCE + i * CONFIG.PIPE_SPACING;
      p.gapY = this.nextGap();
      p.scored = false;
    });
    this.lastX = this.list[this.list.length - 1].x;
    this.visible = true;
    this.intro = 0;
  },
  hide() { this.visible = false; },
  // Ricicla le coppie uscite a sinistra e assegna i punti
  update(scrollNow) {
    for (const p of this.list) {
      if (p.x - scrollNow < cam.recycleX) {
        p.x = this.lastX + CONFIG.PIPE_SPACING;
        this.lastX = p.x;
        p.gapY = this.nextGap();
        p.scored = false;
      }
      if (!p.scored && p.x - scrollNow <= CONFIG.BIRD_X) { p.scored = true; addScore(); }
    }
  },
};

function init() {
  const canvas = $('game');
  try {
    renderer = new THREE.WebGLRenderer({
      canvas, antialias: (window.devicePixelRatio || 1) < 1.5,
      powerPreference: 'high-performance', stencil: false,
    });
  } catch (e) {
    showFatal('WebGL non è disponibile su questo dispositivo o browser.');
    return;
  }
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.type = IS_TOUCH ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
  pixelRatio = Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO);

  const pref = storage.get(KEY_SHADOWS, null);
  shadowsUserSet = pref !== null;
  shadowsOn = pref === null ? !LOW_END : pref === '1';

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(CONFIG.FOV, 1, 0.3, 1500);
  cam.base = new THREE.Vector3();
  cam.target = new THREE.Vector3();

  buildEnvironmentPalette();
  buildSkyAndLights();
  buildGround();
  buildScenery();
  buildPipes();
  birdModel = createBird();
  scene.add(birdModel.root);
  buildFeathers();
  pipes.init();

  applyShadows(shadowsOn, true);
  setupInput();
  setupUI();
  layout();
  applyEnvironment(0);
  toMenu(true);

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
  canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); if (state === S.PLAYING) pauseGame(); });

  if (/[?&]debug\b/.test(location.search)) { // accesso in sola lettura per i test
    window.__svolazzo = { S, get state() { return state; }, get score() { return score; }, get best() { return best; },
      get bird() { return bird; }, get pipes() { return pipes.list; }, get scroll() { return scroll; },
      get paused() { return paused; }, get shadows() { return shadowsOn; }, get night() { return night; },
      get audio() { return Sfx.state; } };
  }

  $('loading').classList.add('hide');
  lastTime = performance.now();
  requestAnimationFrame(frame);
}

    { top: C('#40448f'), horizon: C('#ffb07c'), hemiSky: C('#ffd2b8'), hemiGround: C('#5a4a5e'), hemiI: 0.9,  sunCol: C('#ffb27a'), sunI: 1.7, cloud: C('#ffd6c4'), cloudE: 0.25 },
    { top: C('#070d2c'), horizon: C('#2a3768'), hemiSky: C('#8ea4ff'), hemiGround: C('#1c2542'), hemiI: 0.65, sunCol: C('#a9bcff'), sunI: 0.9, cloud: C('#5f6a98'), cloudE: 0.12 },

function buildSkyAndLights() {
  // Cupola del cielo con gradiente (shader minimale)
  skyMat = new THREE.ShaderMaterial({
    uniforms: { topColor: { value: new THREE.Color() }, horizonColor: { value: new THREE.Color() } },
    vertexShader: `varying vec3 vDir;
      void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform vec3 topColor; uniform vec3 horizonColor; varying vec3 vDir;
      void main(){ float h = clamp(vDir.y, 0.0, 1.0); gl_FragColor = vec4(mix(horizonColor, topColor, pow(h, 0.6)), 1.0);
      #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 24, 12), skyMat);
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);
  scene.userData.sky = sky;

  // Stelle (visibili di notte)
  const rnd = mulberry32(7), pts = [];
  for (let i = 0; i < 360; i++) {
    const th = rnd() * Math.PI * 2, y = 0.08 + rnd() * 0.92, r = Math.sqrt(1 - y * y);
    pts.push(Math.cos(th) * r * 460, y * 460, Math.sin(th) * r * 460);
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  const stars = new THREE.Points(sg, starsMat);
  stars.frustumCulled = false;
  scene.add(stars);
  scene.userData.stars = stars;

  // Sole e luna (dischi lontani)
  sunDisc = new THREE.Mesh(new THREE.CircleGeometry(22, 28), new THREE.MeshBasicMaterial({ color: 0xfff4c2, transparent: true, fog: false, depthWrite: false }));
  moonDisc = new THREE.Mesh(new THREE.CircleGeometry(15, 28), new THREE.MeshBasicMaterial({ color: 0xeef2ff, transparent: true, opacity: 0, fog: false, depthWrite: false }));
  scene.add(sunDisc, moonDisc);

  // Luci: emisferica (ambiente) + direzionale con ombre
  hemi = new THREE.HemisphereLight(0xffffff, 0xb9b08a, 1.15);
  scene.add(hemi);
  sun = new THREE.DirectionalLight(0xfff2da, 2.5);
  sun.shadow.mapSize.set(IS_TOUCH ? 1024 : 2048, IS_TOUCH ? 1024 : 2048);
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 90;
  scene.add(sun, sun.target);

  scene.fog = new THREE.Fog(0xc4ebff, 20, 140);
}

// ============================================================
//  TEXTURE GENERATE VIA CANVAS
// ============================================================
function canvasTexture(w, h, draw, repeat = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
  return t;
}

// ============================================================
//  TERRENO (striscia che scorre in loop) + prato di fondo
// ============================================================
const GROUND_TILE = 2;      // unità di mondo per ripetizione texture
const GROUND_LEN = 100;
const GROUND_FRONT_Z = 2, GROUND_BACK_Z = -2;
const FIELD_END_Z = -7.2;   // oltre il prato c'è la valle nella foschia
function buildGround() {
  // Superficie: righe diagonali
  groundTopTex = canvasTexture(128, 128, (g, w, h) => {
    g.fillStyle = '#7fcb4b'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#95dc5f';
    for (let i = -2; i < 4; i++) {
      const x0 = i * 64;
      g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0 + 32, 0); g.lineTo(x0 + 32 - h, h); g.lineTo(x0 - h, h); g.closePath(); g.fill();
    }
    const r = mulberry32(3);
    g.fillStyle = 'rgba(40,110,30,.35)';
    for (let i = 0; i < 40; i++) g.fillRect(4 + r() * (w - 8), 4 + r() * (h - 8), 2, 2);
  });
  groundTopTex.repeat.set(GROUND_LEN / GROUND_TILE, (GROUND_FRONT_Z - GROUND_BACK_Z) / GROUND_TILE);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_LEN, GROUND_FRONT_Z - GROUND_BACK_Z),
    new THREE.MeshLambertMaterial({ map: groundTopTex }));
  top.rotation.x = -Math.PI / 2;
  top.position.set(0, CONFIG.GROUND_Y, (GROUND_FRONT_Z + GROUND_BACK_Z) / 2);
  top.receiveShadow = true;

  // Lato frontale: terra con bordo d'erba
  groundFrontTex = canvasTexture(64, 128, (g, w, h) => {
    g.fillStyle = '#ddb874'; g.fillRect(0, 0, w, h);
    const r = mulberry32(11);
    g.fillStyle = '#c99d5c';
    for (let i = 0; i < 26; i++) { const x = r() * w, y = 18 + r() * (h - 22); g.fillRect(x, y, 6 + r() * 8, 3); }
    g.fillStyle = '#5aa83a'; g.fillRect(0, 0, w, 11);
    g.fillStyle = '#468f2c'; g.fillRect(0, 11, w, 4);
    g.fillStyle = '#5aa83a';
    for (let x = 0; x < w; x += 8) { g.beginPath(); g.moveTo(x, 14); g.lineTo(x + 8, 14); g.lineTo(x + 4, 20); g.fill(); }
  });
  groundFrontTex.repeat.set(GROUND_LEN / GROUND_TILE, 1);
  const front = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_LEN, 4), new THREE.MeshLambertMaterial({ map: groundFrontTex }));
  front.position.set(0, CONFIG.GROUND_Y - 2, GROUND_FRONT_Z);

  // Prato dietro la pista: finisce sul ciglio della valle
  const fieldDepth = GROUND_BACK_Z - FIELD_END_Z + 0.2;
  const field = new THREE.Mesh(new THREE.PlaneGeometry(300, fieldDepth), new THREE.MeshLambertMaterial({ color: 0x8fd05a }));
  field.rotation.x = -Math.PI / 2;
  field.position.set(0, CONFIG.GROUND_Y - 0.03, GROUND_BACK_Z + 0.2 - fieldDepth / 2);

  const group = new THREE.Group();
  group.add(top, front, field);
  scene.add(group);
  scene.userData.ground = group;
}

// ============================================================
//  SFONDO A PIÙ LIVELLI (parallasse): cespugli, colline, città, nuvole
// ============================================================
let obj3 = null; // Object3D di appoggio (creato in buildScenery, dopo il caricamento di Three.js)
function placeInstance(mesh, i, { y = 0, z = 0, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0 }) {
  obj3.position.set(0, y, z); obj3.rotation.set(rx, ry, rz); obj3.scale.set(sx, sy, sz);
  obj3.updateMatrix(); mesh.setMatrixAt(i, obj3.matrix);
}
function makeLayer(factor, span, z, drift = 0) {
  const L = { factor, span, z, drift, items: [], meshes: new Set() };
  layers.push(L);
  return L;
}
function instanced(geo, mat, count, { shadow = false } = {}) {
  const m = new THREE.InstancedMesh(geo, mat, count);
  m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  m.frustumCulled = false;
  m.castShadow = shadow;
  scene.add(m);
  return m;
}

function buildScenery() {
  obj3 = new THREE.Object3D();
  const rnd = mulberry32(2024);
  const flat = (color, extra = {}) => new THREE.MeshLambertMaterial({ color, flatShading: true, ...extra });
  const col = new THREE.Color();
  cloudMat = flat(0xffffff, { emissive: 0xffffff, emissiveIntensity: 0.32, fog: false });
  const puffGeo = new THREE.IcosahedronGeometry(1, 1);

  // Nuvole: gruppi di "sbuffi" low-poly
  function cloudLayer({ factor, span, z0, z1, y0, y1, n, puffs, size, flatY, drift }) {
    const L = makeLayer(factor, span, (z0 + z1) / 2, drift);
    const mesh = instanced(puffGeo, cloudMat, n * puffs);
    let idx = 0;
    for (let c = 0; c < n; c++) {
      const item = { base: (c / n) * span + rnd() * 6, parts: [] };
      const z = z0 + rnd() * (z1 - z0), y = y0 + rnd() * (y1 - y0), s = size[0] + rnd() * (size[1] - size[0]);
      for (let p = 0; p < puffs; p++) {
        const dx = (p - (puffs - 1) / 2) * s * 1.25 + (rnd() - 0.5) * s * 0.4;
        const k = p === 0 || p === puffs - 1 ? 0.85 : 1.2;
        placeInstance(mesh, idx, { y: y + (k - 1) * s * 0.6, z: z + rnd(), sx: s * k * 1.2, sy: s * k * flatY, sz: s * k, ry: rnd() * 3 });
        item.parts.push({ mesh, index: idx++, dx });
      }
      L.items.push(item);
    }
    L.meshes.add(mesh);
  }
  // --- Nuvole alte (livello più lento, deriva propria) ---
  cloudLayer({ factor: 0.18, span: 240, z0: -45, z1: -85, y0: 11, y1: 26, n: 16, puffs: 4, size: [1.5, 3.2], flatY: 0.85, drift: 0.25 });

  // --- Città lontana nella valle (finestre accese di notte) ---
  {
    const L = makeLayer(0.3, 180, -62);
    const nB = 34, BASE = -32;
    const bGeo = new THREE.BoxGeometry(1, 1, 1); bGeo.translate(0, 0.5, 0);
    const bMesh = instanced(bGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), nB);
    windowMat = new THREE.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0, depthWrite: false });
    const maxWin = 420;
    const wMesh = instanced(new THREE.PlaneGeometry(0.55, 0.7), windowMat, maxWin);
    const palette = ['#9fb7dc', '#abc2e2', '#b8c7e8', '#93add6', '#c2cfea', '#a6b3dc'];
    let wi = 0, x = 0;
    for (let b = 0; b < nB; b++) {
      const w = 3.2 + rnd() * 3.4, top = 1 + rnd() * 10, d = 3 + rnd() * 2, z = -56 - rnd() * 12;
      const item = { base: x + w / 2, parts: [] };
      x += w + 0.4 + rnd() * 1.4;
      placeInstance(bMesh, b, { y: BASE, z, sx: w, sy: top - BASE, sz: d });
      bMesh.setColorAt(b, col.set(palette[b % palette.length]));
      item.parts.push({ mesh: bMesh, index: b, dx: 0 });
      const cols = Math.max(1, Math.floor((w - 0.7) / 1.1));
      for (let wy = top - 1.2; wy > -5; wy -= 1.5) for (let c = 0; c < cols; c++) {
        if (wi >= maxWin || rnd() > 0.45) continue;
        placeInstance(wMesh, wi, { y: wy, z: z + d / 2 + 0.03 });
        item.parts.push({ mesh: wMesh, index: wi++, dx: -((cols - 1) * 1.1) / 2 + c * 1.1 });
      }
      L.items.push(item);
    }
    wMesh.count = wi;
    bMesh.instanceColor.needsUpdate = true;
    L.meshes.add(bMesh); L.meshes.add(wMesh);
    L.span = Math.max(L.span, x); // la città copre tutto il giro senza buchi
  }

  // --- Banchi di nuvole basse nella valle (coprono la base della città) ---
  cloudLayer({ factor: 0.28, span: 200, z0: -38, z1: -52, y0: -3.5, y1: -0.8, n: 18, puffs: 5, size: [2.2, 3.6], flatY: 0.55, drift: 0.12 });

  // --- Colline low-poly che spuntano dalla valle ---
  {
    const L = makeLayer(0.5, 130, -22);
    const n = 18;
    const mesh = instanced(puffGeo, flat(0xffffff), n);
    const palette = ['#86cc7c', '#78c179', '#93d487', '#7fc78c', '#8ccf78'];
    for (let i = 0; i < n; i++) {
      const r = 5 + rnd() * 5, top = 0.3 + rnd() * 3.2;
      placeInstance(mesh, i, { y: -9, z: -15 - rnd() * 12, sx: r * 1.6, sy: 9 + top, sz: r, ry: rnd() * 3 });
      mesh.setColorAt(i, col.set(palette[i % palette.length]));
      L.items.push({ base: (i / n) * L.span + rnd() * 3, parts: [{ mesh, index: i, dx: 0 }] });
    }
    mesh.instanceColor.needsUpdate = true;
    L.meshes.add(mesh);
  }

  // --- Siepi e alberelli sul ciglio del prato (stessa velocità della pista) ---
  {
    const L = makeLayer(1.0, 60, -5);
    const greens = ['#3f9a45', '#4aa84c', '#3a8f40', '#52b050'];
    const nS = 26, puffs = 3, nH = 22, nT = 9;
    const bush = instanced(puffGeo, flat(0xffffff), nS * puffs + nH * puffs);
    const trunk = instanced(new THREE.CylinderGeometry(0.12, 0.17, 1, 6).translate(0, 0.5, 0), flat(0x8a5a33), nT);
    const crown = instanced(new THREE.ConeGeometry(0.95, 2.3, 7).translate(0, 1.15, 0), flat(0x2f8a4a), nT);
    let bi = 0;
    const addBush = (base, z, s) => {
      const item = { base, parts: [] };
      for (let p = 0; p < puffs; p++) {
        const k = p === 1 ? 1.25 : 0.85;
        placeInstance(bush, bi, { y: CONFIG.GROUND_Y + 0.05, z: z + (rnd() - 0.5) * 0.3, sx: s * k * 1.1, sy: s * k * 0.9, sz: s * k, ry: rnd() * 3 });
        bush.setColorAt(bi, col.set(greens[(bi + p) % greens.length]));
        item.parts.push({ mesh: bush, index: bi++, dx: (p - 1) * s * 0.95 });
      }
      L.items.push(item);
    };
    for (let i = 0; i < nS; i++) addBush((i / nS) * L.span + rnd() * 1.2, -2.7 - rnd() * 1.6, 0.35 + rnd() * 0.3);
    // siepe continua sul bordo: nasconde la fine del prato
    for (let i = 0; i < nH; i++) addBush((i / nH) * L.span + rnd() * 0.8, FIELD_END_Z + 0.4, 0.7 + rnd() * 0.35);
    for (let i = 0; i < nT; i++) {
      const s = 0.65 + rnd() * 0.45, z = -4.6 - rnd() * 2;
      placeInstance(trunk, i, { y: CONFIG.GROUND_Y, z, sx: s, sy: 0.7 * s, sz: s });
      placeInstance(crown, i, { y: CONFIG.GROUND_Y + 0.6 * s, z, sx: s, sy: s, sz: s, ry: rnd() * 3 });
      L.items.push({ base: (i / nT) * L.span + 3 + rnd() * 3, parts: [{ mesh: trunk, index: i, dx: 0 }, { mesh: crown, index: i, dx: 0 }] });
    }
    bush.instanceColor.needsUpdate = true;
    L.meshes.add(bush); L.meshes.add(trunk); L.meshes.add(crown);
  }
}

function updateLayers(scrollI, timeI) {
  for (const L of layers) {
    const off = scrollI * L.factor + timeI * L.drift;
    const cx = cam.lookX + L.z * cam.yawTan; // centro visibile a quella profondità
    for (const it of L.items) {
      const x = cx + wrap(it.base - off, L.span);
      for (const p of it.parts) p.mesh.instanceMatrix.array[p.index * 16 + 12] = x + p.dx;
    }
    L.meshes.forEach((m) => { m.instanceMatrix.needsUpdate = true; });
  }
}

// ============================================================
//  MODELLI: TUBI (InstancedMesh alimentate dal pool)
// ============================================================
function buildPipes() {
  const N = CONFIG.PIPE_POOL_SIZE, R = CONFIG.PIPE_RADIUS, RC = CONFIG.PIPE_CAP_RADIUS, CH = CONFIG.PIPE_CAP_HEIGHT;
  // Righe verticali leggere: look cartoon con ombreggiatura morbida
  const stripes = canvasTexture(64, 4, (g, w, h) => {
    g.fillStyle = '#dcdcdc'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#ffffff'; g.fillRect(50, 0, 7, h);
    g.fillStyle = '#c4c4c4'; g.fillRect(10, 0, 2, h); g.fillRect(30, 0, 2, h);
  });
  const ring = canvasTexture(64, 64, (g, w, h) => {
    g.fillStyle = '#3fae35'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#5cc74c'; g.beginPath(); g.arc(w / 2, h / 2, w * 0.49, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1d5a19'; g.beginPath(); g.arc(w / 2, h / 2, w * 0.36, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#123d10'; g.beginPath(); g.arc(w / 2, h / 2, w * 0.28, 0, Math.PI * 2); g.fill();
  }, false);
  const bodyMat = new THREE.MeshPhongMaterial({ color: 0x5cc94a, map: stripes, shininess: 45, specular: 0x2a3a22 });
  const capSide = new THREE.MeshPhongMaterial({ color: 0x4bb53c, map: stripes, shininess: 45, specular: 0x2a3a22 });
  const capEnd = new THREE.MeshPhongMaterial({ map: ring, shininess: 20, specular: 0x111111 });

  const bodyGeo = new THREE.CylinderGeometry(R, R, 1, 22, 1, true); bodyGeo.translate(0, 0.5, 0);
  const capGeo = new THREE.CylinderGeometry(RC, RC, CH, 22, 1, false);

  const mk = (geo, mat) => {
    const m = new THREE.InstancedMesh(geo, mat, N);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; m.count = 0;
    scene.add(m);
    return m;
  };
  pipeMeshes = {
    bodyB: mk(bodyGeo, bodyMat), bodyT: mk(bodyGeo, bodyMat),
    capB: mk(capGeo, [capSide, capEnd, capEnd]), capT: mk(capGeo, [capSide, capEnd, capEnd]),
  };
  pipeMeshes.all = [pipeMeshes.bodyB, pipeMeshes.bodyT, pipeMeshes.capB, pipeMeshes.capT];
  tmpMat = new THREE.Matrix4();
}

let tmpMat = null; // matrice di appoggio riutilizzata (nessuna allocazione per frame)
function setTS(mesh, i, x, y, sy) {
  tmpMat.makeScale(1, sy, 1); tmpMat.setPosition(x, y, 0);
  mesh.setMatrixAt(i, tmpMat);
}
function renderPipes(scrollI, frameDt) {
  const P = pipeMeshes, all = P.all;
  const n = pipes.visible ? CONFIG.PIPE_POOL_SIZE : 0;
  for (const m of all) m.count = n;
  if (!n) return;
  if (pipes.intro < 1) pipes.intro = Math.min(1, pipes.intro + frameDt / 0.45);
  const off = (1 - easeOutCubic(pipes.intro)) * 9; // ingresso animato (solo grafico)
  const CH = CONFIG.PIPE_CAP_HEIGHT, half = CONFIG.PIPE_GAP / 2;
  for (let i = 0; i < n; i++) {
    const p = pipes.list[i], x = p.x - scrollI;
    const gb = p.gapY - half, gt = p.gapY + half;
    setTS(P.bodyB, i, x, PIPE_BOTTOM - off, gb - CH - PIPE_BOTTOM);
    setTS(P.capB, i, x, gb - CH / 2 - off, 1);
    setTS(P.bodyT, i, x, gt + CH + off, PIPE_TOP - gt - CH);
    setTS(P.capT, i, x, gt + CH / 2 + off, 1);
  }
  for (const m of all) m.instanceMatrix.needsUpdate = true;
}

// ============================================================
//  MODELLO: UCCELLO low-poly
// ============================================================
function createBird() {
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);
  // leggero emissivo: colori vivaci anche sui lati in ombra
  const M = (color, extra = {}) => new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.14, flatShading: true, shininess: 30, specular: 0x333333, ...extra });
  const yellow = M(0xffc928), bellyM = M(0xfff1b8), orange = M(0xff8a1c), orangeDk = M(0xe2620e);
  const white = M(0xffffff, { shininess: 80 }), black = M(0x16110c, { shininess: 120, specular: 0x999999 });
  const wingM = M(0xffe066), tailM = M(0xf2a31d), blush = M(0xff9c8a);
  const add = (geo, mat, x, y, z, sx = 1, sy = 1, sz = 1, parent = body) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true;
    parent.add(m); return m;
  };
  // Corpo e pancia
  add(new THREE.IcosahedronGeometry(0.38, 1), yellow, 0, 0, 0, 1.16, 0.98, 0.96);
  add(new THREE.IcosahedronGeometry(0.26, 1), bellyM, 0.13, -0.13, 0, 1.15, 0.85, 1.22);
  // Becco (superiore + inferiore)
  const beakUp = new THREE.ConeGeometry(0.13, 0.34, 6); beakUp.rotateZ(-Math.PI / 2);
  add(beakUp, orange, 0.52, 0.01, 0, 1, 0.75, 1.05);
  const beakLow = new THREE.ConeGeometry(0.1, 0.24, 6); beakLow.rotateZ(-Math.PI / 2);
  add(beakLow, orangeDk, 0.46, -0.09, 0, 1, 0.6, 0.9);
  // Occhi grandi (entrambi i lati)
  const eyeG = new THREE.SphereGeometry(0.155, 12, 10), pupG = new THREE.SphereGeometry(0.078, 10, 8), glG = new THREE.SphereGeometry(0.03, 6, 5);
  const blG = new THREE.SphereGeometry(0.065, 8, 6);
  for (const s of [1, -1]) {
    add(eyeG, white, 0.2, 0.15, 0.25 * s, 1, 1.12, 0.72);
    add(pupG, black, 0.285, 0.15, 0.33 * s, 1, 1.12, 0.7);
    add(glG, white, 0.315, 0.195, 0.372 * s);
    add(blG, blush, 0.3, -0.02, 0.26 * s, 1, 0.7, 0.45);
  }
  // Ciuffo
  const crestG = new THREE.ConeGeometry(0.06, 0.2, 4);
  add(crestG, tailM, 0.02, 0.43, 0, 1, 1, 1).rotation.z = 0.35;
  add(crestG, tailM, -0.07, 0.4, 0, 0.9, 0.85, 0.9).rotation.z = 0.75;
  // Coda a ventaglio
  const tailG = new THREE.ConeGeometry(0.15, 0.32, 4); tailG.rotateZ(-Math.PI / 2);
  add(tailG, tailM, -0.5, 0.05, 0, 1, 0.45, 1.25).rotation.z = 0.25;
  // Ali su perni (animate)
  const wingG = new THREE.IcosahedronGeometry(0.2, 0);
  const wings = [];
  for (const s of [1, -1]) {
    const pivot = new THREE.Group();
    pivot.position.set(-0.05, 0.05, 0.27 * s);
    body.add(pivot);
    add(wingG, wingM, -0.07, 0, 0.2 * s, 1.4, 0.32, 1.25, pivot);
    wings.push(pivot);
  }
  return { root, body, wingL: wings[0], wingR: wings[1] };
}

// Piume all'impatto (pool fisso)
function buildFeathers() {
  const geo = new THREE.PlaneGeometry(0.2, 0.08);
  for (let i = 0; i < 8; i++) {
    const mat = new THREE.MeshLambertMaterial({ color: i % 2 ? 0xffe066 : 0xffc928, side: THREE.DoubleSide, transparent: true, opacity: 1, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    scene.add(mesh);
    feathers.push({ mesh, mat, life: 0, vx: 0, vy: 0, vz: 0, spin: 0 });
  }
}
function spawnFeathers() {
  for (const f of feathers) {
    f.life = rand(0.8, 1.3); f.mesh.visible = true;
    f.mesh.position.set(CONFIG.BIRD_X, bird.y, bird.z + 0.3);
    f.vx = rand(-2.5, 1.5); f.vy = rand(0.5, 3.5); f.vz = rand(0.3, 2.2); f.spin = rand(-12, 12);
    f.mat.opacity = 1;
  }
}
function updateFeathers(dt) {
  for (const f of feathers) {
    if (f.life <= 0) continue;
    f.life -= dt;
    f.vy -= 5 * dt;
    const drag = 1 - 1.6 * dt;
    f.vx *= drag; f.vz *= drag;
    const p = f.mesh.position;
    p.x += f.vx * dt; p.y += f.vy * dt; p.z += f.vz * dt;
    f.mesh.rotation.z += f.spin * dt; f.mesh.rotation.x += f.spin * 0.5 * dt;
    f.mat.opacity = clamp(f.life / 0.4, 0, 1);
    if (f.life <= 0 || p.y < CONFIG.GROUND_Y + 0.05) { f.life = 0; f.mesh.visible = false; }
  }
}

// ============================================================
//  OMBRE / QUALITÀ
// ============================================================
function applyShadows(on, silent) {
  shadowsOn = on;
  renderer.shadowMap.enabled = on;
  sun.castShadow = on;
  scene.traverse((o) => {
    if (!o.material) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; });
  });
  const b = $('btnShadows');
  b.classList.toggle('off', !on);
  b.setAttribute('aria-label', on ? 'Ombre attive' : 'Ombre disattivate');
  if (!silent) toast(on ? 'Ombre attive' : 'Ombre disattivate');
}
function toggleShadows() {
  applyShadows(!shadowsOn);
  shadowsUserSet = true;
  storage.set(KEY_SHADOWS, shadowsOn ? '1' : '0');
}
// Se il dispositivo fatica, riduce automaticamente la qualità
const perf = { t: 0, frames: 0 };
function monitorPerf(dt) {
  if (state !== S.PLAYING || paused || dt > 0.2) return;
  perf.t += dt; perf.frames++;
  if (perf.t < 3) return;
  const fps = perf.frames / perf.t;
  perf.t = 0; perf.frames = 0;
  if (fps >= 48) return;
  if (shadowsOn && !shadowsUserSet) {
    applyShadows(false, true);
    toast('Ombre disattivate per maggiore fluidità');
  } else if (pixelRatio > 1.25) {
    pixelRatio = Math.max(1, pixelRatio - 0.5);
    layout();
  }
}

// ============================================================
//  CAMERA E RESPONSIVE
// ============================================================
function layout() {
  const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
  renderer.setPixelRatio(pixelRatio);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

  const tanHalf = Math.tan(THREE.MathUtils.degToRad(CONFIG.FOV / 2));
  const needH = CONFIG.VIEW_Y_MAX - CONFIG.VIEW_Y_MIN;
  // distanza minima per vedere tutta l'altezza e almeno VIEW_MIN_WIDTH in larghezza
  const dist = Math.max(needH / (2 * tanHalf), CONFIG.VIEW_MIN_WIDTH / (2 * tanHalf * camera.aspect)) * 1.03;
  cam.dist = dist;
  cam.visH = 2 * tanHalf * dist;
  cam.visW = cam.visH * camera.aspect;
  cam.lookX = CONFIG.BIRD_X + clamp(cam.visW * 0.2, 1.1, 6); // l'uccello sta a ~30% da sinistra
  const centerY = (CONFIG.VIEW_Y_MIN + CONFIG.VIEW_Y_MAX) / 2;
  const pitch = THREE.MathUtils.degToRad(CONFIG.CAM_PITCH_DEG), yaw = THREE.MathUtils.degToRad(CONFIG.CAM_YAW_DEG);
  cam.yawTan = Math.tan(yaw);
  cam.target.set(cam.lookX, centerY, 0);
  cam.base.set(
    cam.lookX + dist * Math.sin(yaw) * Math.cos(pitch),
    centerY + dist * Math.sin(pitch),
    dist * Math.cos(yaw) * Math.cos(pitch),
  );
  camera.position.copy(cam.base);
  camera.lookAt(cam.target);
  camera.updateProjectionMatrix();
  cam.recycleX = cam.lookX - cam.visW / 2 - 3;

  // Elementi che seguono l'inquadratura
  scene.userData.sky.position.copy(cam.base);
  scene.userData.stars.position.copy(cam.base);
  scene.userData.ground.position.x = cam.lookX;
  sunDisc.position.set(cam.base.x - 150, cam.base.y + 170, cam.base.z - 380); sunDisc.lookAt(cam.base);
  moonDisc.position.set(cam.base.x + 120, cam.base.y + 150, cam.base.z - 380); moonDisc.lookAt(cam.base);
  scene.fog.near = dist + 3;
  scene.fog.far = dist + 105;

  // Volume delle ombre centrato sull'area di gioco
  const sc = sun.shadow.camera, half = cam.visW / 2 + 5;
  sc.left = -half; sc.right = half; sc.top = 13; sc.bottom = -13;
  sc.updateProjectionMatrix();
  sun.target.position.set(cam.lookX, 3, 0);
  sun.position.set(cam.lookX - 12, 3 + 48, 16);
}

// ============================================================
//  INPUT (Pointer Events + tastiera)
// ============================================================
const isControl = (t) => !!(t && t.closest && t.closest('button'));
function setupInput() {
  // Sblocco audio su ogni tipo di gesto (iOS richiede touchend/click)
  ['pointerdown', 'pointerup', 'touchend', 'mousedown', 'keydown', 'click'].forEach((ev) =>
    window.addEventListener(ev, Sfx.unlock, { capture: true, passive: true }));

  // Battito: risposta immediata su pointerdown
  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (isControl(e.target)) return;
    if (e.cancelable) e.preventDefault();
    onAction('pointer');
  }, { passive: false });

  // Blocca scroll, zoom, doppio tocco e menu contestuale
  document.addEventListener('touchstart', (e) => { if (e.cancelable && !isControl(e.target)) e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    const k = e.code;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter' || k === 'NumpadEnter') {
      e.preventDefault();
      if (!e.repeat) onAction('key');
    } else if (k === 'KeyP' || k === 'Escape') {
      if (state === S.PLAYING) { if (paused) resumeGame(); else pauseGame(); }
    } else if (k === 'KeyM') {
      toggleMute();
    }
  });

  // Pausa automatica quando la pagina va in background
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) onHidden();
    else { lastTime = performance.now(); accumulator = 0; Sfx.resume(); }
  });
  window.addEventListener('pagehide', onHidden);
}
function onHidden() {
  if (state === S.PLAYING) { cancelCountdown(); pauseGame(); }
  Sfx.suspend();
}

// Azione unica del gioco, a seconda dello stato
function onAction(source) {
  switch (state) {
    case S.MENU: if (source === 'key') toReady(); break;
    case S.READY: startPlaying(); break;
    case S.PLAYING:
      if (!paused) flap();
      else if (source === 'key') resumeGame();
      break;
    case S.GAMEOVER:
      if (source === 'key' && performance.now() >= inputLockUntil) toReady();
      break;
    default: break; // DYING: input ignorato
  }
}

// ============================================================
//  TRANSIZIONI DI STATO
// ============================================================
function resetRun() {
  score = 0;
  bird.y = CONFIG.BIRD_START_Y; bird.vy = 0; bird.rot = 0; bird.z = 0; bird.landed = false; bird.flapT = 1; bird.squash = 0;
  Object.assign(prev, { y: bird.y, rot: 0, z: 0 });
  pipes.hide();
  nightTarget = 0;
  panelShown = false;
  for (const f of feathers) { f.life = 0; f.mesh.visible = false; }
  UI.setScore(0, false);
}
function toMenu(initial) {
  state = S.MENU; paused = false;
  resetRun();
  $('menuBest').textContent = best;
  UI.show('menu');
  if (!initial) Sfx.swoosh();
  syncHud();
}
function toReady() {
  state = S.READY; paused = false;
  resetRun();
  UI.show('ready');
  Sfx.swoosh();
  syncHud();
}
function startPlaying() {
  state = S.PLAYING;
  bird.visX = 0;
  pipes.reset(scroll);
  perf.t = 0; perf.frames = 0;
  UI.show(null);
  syncHud();
  flap();
}
function flap() {
  bird.vy = CONFIG.FLAP_IMPULSE;   // azzera la velocità e applica l'impulso fisso
  bird.flapT = 0; bird.squash = 1;
  Sfx.flap();
}
function addScore() {
  score++;
  UI.setScore(score, true);
  Sfx.point();
  if (CONFIG.DAY_NIGHT_EVERY > 0 && score % CONFIG.DAY_NIGHT_EVERY === 0) nightTarget = nightTarget > 0.5 ? 0 : 1;
}
function die(cause) {
  state = S.DYING;
  dieCause = cause; dieTime = 0; landTime = 0; fallSoundPlayed = false;
  bird.landed = cause === 'ground';
  if (!bird.landed) bird.vy = Math.min(bird.vy, 1);
  Sfx.hit();
  flashScreen();
  if (!REDUCED_MOTION) { shake.t = 0; shake.dur = 0.38; shake.amp = 0.28; }
  spawnFeathers();
  try { if (navigator.vibrate) navigator.vibrate(35); } catch (e) {}
  syncHud();
}
function showGameOver() {
  state = S.GAMEOVER; panelShown = true;
  const isNew = score > best;
  if (isNew) { best = score; storage.set(KEY_BEST, best); }
  const medal = CONFIG.MEDALS.find((m) => score >= m.min) || null;
  inputLockUntil = performance.now() + CONFIG.GAMEOVER_INPUT_LOCK * 1000;
  UI.showGameOver(score, best, isNew, medal);
  Sfx.swoosh();
  syncHud();
}
function pauseGame() {
  if (state !== S.PLAYING || paused) return;
  paused = true;
  UI.show('pause');
  syncHud();
}
function resumeGame() {
  if (state !== S.PLAYING || !paused || countdownTimer) return;
  const el = $('countdown'), scr = $('pause');
  let n = 3;
  scr.classList.add('counting');
  el.textContent = n;
  const tick = () => {
    n--;
    if (n > 0) { el.textContent = n; countdownTimer = setTimeout(tick, 550); return; }
    countdownTimer = null;
    el.textContent = ''; scr.classList.remove('counting');
    paused = false; accumulator = 0; lastTime = performance.now();
    UI.show(null);
    syncHud();
  };
  countdownTimer = setTimeout(tick, 550);
}
function cancelCountdown() {
  if (countdownTimer) clearTimeout(countdownTimer);
  countdownTimer = null;
  $('countdown').textContent = '';
  $('pause').classList.remove('counting');
}
function toggleMute() {
  Sfx.setMuted(!Sfx.muted);
  updateSoundIcon();
  toast(Sfx.muted ? 'Audio disattivato' : 'Audio attivo');
}

// ============================================================
//  FISICA (step fisso) E COLLISIONI
// ============================================================
function step(dt) {
  prev.y = bird.y; prev.rot = bird.rot; prev.z = bird.z; prev.scroll = scroll; prev.time = simTime;
  simTime += dt;
  switch (state) {
    case S.MENU:
    case S.READY: {
      scroll += CONFIG.PIPE_SPEED * dt;
      const ph = simTime * Math.PI * 2 * CONFIG.BOB_HZ;
      bird.y = CONFIG.BIRD_START_Y + Math.sin(ph) * CONFIG.BOB_AMP;
      bird.rot = Math.cos(ph) * 0.06;
      break;
    }
    case S.PLAYING:
      updatePlaying(dt);
      break;
    case S.DYING:
      updateDying(dt);
      break;
    default: break;
  }
  updateWings(dt);
  updateFeathers(dt);
}

function updatePlaying(dt) {
  // Gravità con velocità di caduta limitata
  bird.vy = Math.max(bird.vy - CONFIG.GRAVITY * dt, -CONFIG.MAX_FALL_SPEED);
  bird.y += bird.vy * dt;
  // Rotazione: su quando sale, picchiata progressiva quando cade
  if (bird.vy > CONFIG.ROT_DIVE_VY) bird.rot = approach(bird.rot, CONFIG.ROT_UP, CONFIG.ROT_UP_SPEED * dt);
  else bird.rot = approach(bird.rot, CONFIG.ROT_DOWN, CONFIG.ROT_DOWN_SPEED * dt);

  scroll += CONFIG.PIPE_SPEED * dt;
  pipes.update(scroll);

  const r = CONFIG.BIRD_HITBOX;
  if (bird.y - r <= CONFIG.GROUND_Y) { bird.y = CONFIG.GROUND_Y + r; die('ground'); return; }
  if (bird.y + r >= CONFIG.CEILING_Y) { bird.y = CONFIG.CEILING_Y - r; die('ceiling'); return; }
  for (const p of pipes.list) if (hitsPipe(p)) { die('pipe'); return; }
}

// Cerchio contro rettangolo (piano di gioco z = 0)
function circleRect(cx, cy, r, x0, y0, x1, y1) {
  const dx = cx - clamp(cx, x0, x1), dy = cy - clamp(cy, y0, y1);
  return dx * dx + dy * dy < r * r;
}
function hitsPipe(p) {
  const px = p.x - scroll, bx = CONFIG.BIRD_X, by = bird.y, r = CONFIG.BIRD_HITBOX;
  const R = CONFIG.PIPE_RADIUS, RC = CONFIG.PIPE_CAP_RADIUS, CH = CONFIG.PIPE_CAP_HEIGHT;
  if (Math.abs(px - bx) > RC + r) return false;
  const gb = p.gapY - CONFIG.PIPE_GAP / 2, gt = p.gapY + CONFIG.PIPE_GAP / 2;
  return circleRect(bx, by, r, px - R, -1e3, px + R, gb)
      || circleRect(bx, by, r, px - RC, gb - CH, px + RC, gb)
      || circleRect(bx, by, r, px - R, gt, px + R, 1e3)
      || circleRect(bx, by, r, px - RC, gt, px + RC, gt + CH);
}

function updateDying(dt) {
  dieTime += dt;
  bird.z = approach(bird.z, DIE_Z, 4 * dt);
  if (!bird.landed) {
    bird.vy = Math.max(bird.vy - CONFIG.GRAVITY * dt, -CONFIG.MAX_FALL_SPEED);
    bird.y += bird.vy * dt;
    bird.rot = approach(bird.rot, CONFIG.ROT_DOWN, CONFIG.ROT_DOWN_SPEED * 1.6 * dt);
    if (!fallSoundPlayed && dieTime > 0.16) { Sfx.fall(); fallSoundPlayed = true; }
    if (bird.y <= GROUND_REST_Y) {
      bird.y = GROUND_REST_Y; bird.vy = 0; bird.landed = true; landTime = dieTime;
      if (!REDUCED_MOTION) { shake.t = 0; shake.dur = 0.18; shake.amp = 0.1; }
    }
  } else {
    bird.y = approach(bird.y, GROUND_REST_Y, 2 * dt);
    bird.rot = approach(bird.rot, CONFIG.ROT_DOWN, 8 * dt);
    if (!panelShown && dieTime - landTime >= CONFIG.GAMEOVER_PANEL_DELAY) showGameOver();
  }
}

function updateWings(dt) {
  let target;
  if (state === S.DYING || state === S.GAMEOVER) target = 0.95;           // ali alzate
  else if (bird.flapT < 1) {                                               // colpo d'ala
    bird.flapT = Math.min(1, bird.flapT + dt / CONFIG.WING_FLAP_TIME);
    target = 0.15 + 0.85 * Math.cos(bird.flapT * Math.PI * 2);
  } else if (state === S.PLAYING && bird.vy < -2.5) target = 0.45;         // planata
  else target = 0.2 + 0.6 * Math.sin(simTime * Math.PI * 2 * CONFIG.WING_IDLE_HZ);
  bird.wing += (target - bird.wing) * (1 - Math.exp(-dt * 35));
  bird.squash = Math.max(0, bird.squash - dt * 6);
}

// ============================================================
//  GIORNO / NOTTE
// ============================================================
function applyEnvironment(t) {
  const k = t < 0.5 ? t * 2 : (t - 0.5) * 2;
  const A = t < 0.5 ? ENV[0] : ENV[1], B = t < 0.5 ? ENV[1] : ENV[2];
  skyMat.uniforms.topColor.value.lerpColors(A.top, B.top, k);
  skyMat.uniforms.horizonColor.value.lerpColors(A.horizon, B.horizon, k);
  scene.fog.color.copy(skyMat.uniforms.horizonColor.value);
  renderer.setClearColor(scene.fog.color);
  hemi.color.lerpColors(A.hemiSky, B.hemiSky, k);
  hemi.groundColor.lerpColors(A.hemiGround, B.hemiGround, k);
  hemi.intensity = lerp(A.hemiI, B.hemiI, k);
  sun.color.lerpColors(A.sunCol, B.sunCol, k);
  sun.intensity = lerp(A.sunI, B.sunI, k);
  cloudMat.color.lerpColors(A.cloud, B.cloud, k);
  cloudMat.emissive.copy(cloudMat.color);
  cloudMat.emissiveIntensity = lerp(A.cloudE, B.cloudE, k);
  starsMat.opacity = smoothstep(0.55, 1, t);
  windowMat.opacity = smoothstep(0.45, 1, t) * 0.95;
  sunDisc.material.opacity = 1 - smoothstep(0, 0.55, t);
  moonDisc.material.opacity = smoothstep(0.6, 1, t);
  sunDisc.visible = sunDisc.material.opacity > 0.01;
  moonDisc.visible = moonDisc.material.opacity > 0.01;
  scene.userData.stars.visible = starsMat.opacity > 0.01;
  envApplied = t;
}

// ============================================================
//  INTERFACCIA (HTML sopra il canvas)
// ============================================================
const SOUND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.6 6a8.6 8.6 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>';
const SOUND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function updateSoundIcon() {
  const b = $('btnSound');
  b.innerHTML = Sfx.muted ? SOUND_OFF : SOUND_ON;
  b.classList.toggle('off', Sfx.muted);
  b.setAttribute('aria-label', Sfx.muted ? 'Attiva audio' : 'Disattiva audio');
}
function flashScreen() {
  const f = $('flash');
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
}
function syncHud() {
  $('score').classList.toggle('show', state === S.PLAYING || state === S.DYING);
  $('btnPause').classList.toggle('show', state === S.PLAYING && !paused);
}
const UI = {
  screens: null,
  show(name) {
    for (const k in this.screens) this.screens[k].classList.toggle('show', k === name);
  },
  setScore(v, pop) {
    const s = $('score');
    s.textContent = v;
    if (pop) { s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
  },
  showGameOver(sc, bst, isNew, medal) {
    const goScore = $('goScore'), medalEl = $('medal'), badge = $('newBadge');
    const retry = $('btnRetry'), menu = $('btnMenu');
    goScore.textContent = '0';
    $('goBest').textContent = bst;
    badge.classList.remove('show');
    medalEl.className = 'medal none';
    $('medalName').textContent = '—';
    retry.disabled = true; menu.disabled = true;   // tocchi ignorati per ~0,5 s
    this.show('gameover');
    setTimeout(() => { retry.disabled = false; menu.disabled = false; }, CONFIG.GAMEOVER_INPUT_LOCK * 1000);
    // Conteggio animato del punteggio, poi medaglia
    const dur = Math.min(900, 150 + sc * 28), t0 = performance.now();
    const tick = (now) => {
      const k = clamp((now - t0) / dur, 0, 1);
      goScore.textContent = Math.round(sc * k);
      if (k < 1) { requestAnimationFrame(tick); return; }
      if (isNew) badge.classList.add('show');
      if (medal) {
        medalEl.className = 'medal ' + medal.id;
        void medalEl.offsetWidth; medalEl.classList.add('reveal');
        $('medalName').textContent = medal.name;
      } else {
        $('medalName').textContent = 'Nessuna';
      }
    };
    requestAnimationFrame(tick);
  },
};
function setupUI() {
  UI.screens = { menu: $('menu'), ready: $('ready'), gameover: $('gameover'), pause: $('pause') };
  updateSoundIcon();
  const click = (id, fn) => $(id).addEventListener('click', (e) => { e.currentTarget.blur(); fn(); });
  click('btnPlay', () => { if (state === S.MENU) toReady(); });
  click('btnRetry', () => { if (state === S.GAMEOVER && performance.now() >= inputLockUntil) toReady(); });
  click('btnMenu', () => { if (state === S.GAMEOVER && performance.now() >= inputLockUntil) toMenu(); });
  click('btnResume', resumeGame);
  click('btnPause', pauseGame);
  click('btnSound', toggleMute);
  click('btnShadows', toggleShadows);
}

// ============================================================
//  LOOP PRINCIPALE (accumulatore + interpolazione)
// ============================================================
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (!(dt > 0)) dt = 0;
  monitorPerf(dt);
  if (dt > 0.25) dt = 0.25; // evita la "spirale" dopo uno stallo

  if (!paused) {
    accumulator += dt;
    let steps = 0;
    // la piccola tolleranza evita che l'errore in virgola mobile rimandi uno step al frame dopo
    while (accumulator >= CONFIG.FIXED_DT - 1e-7 && steps < 40) {
      step(CONFIG.FIXED_DT);
      accumulator -= CONFIG.FIXED_DT;
      steps++;
    }
  }
  render(paused ? 1 : clamp(accumulator / CONFIG.FIXED_DT, 0, 1), dt);
}

function render(a, dt) {
  const scrollI = lerp(prev.scroll, scroll, a);
  const timeI = lerp(prev.time, simTime, a);

  // Uccello (posizione interpolata tra due step fissi)
  const targetX = state === S.MENU ? cam.lookX - CONFIG.BIRD_X : 0;
  if (state === S.MENU || state === S.READY) bird.visX += (targetX - bird.visX) * (1 - Math.exp(-dt * 6));
  else bird.visX = 0;
  const R = birdModel.root;
  R.position.set(CONFIG.BIRD_X + bird.visX, lerp(prev.y, bird.y, a), lerp(prev.z, bird.z, a));
  R.rotation.z = lerp(prev.rot, bird.rot, a);
  birdModel.wingL.rotation.x = -bird.wing;
  birdModel.wingR.rotation.x = bird.wing;
  const s = bird.squash;
  birdModel.body.scale.set(1 - 0.1 * s, 1 + 0.13 * s, 1 - 0.04 * s);

  // Terreno che scorre (stessa velocità dei tubi)
  const u = (scrollI / GROUND_TILE) % 1;
  groundTopTex.offset.x = u;
  groundFrontTex.offset.x = u;

  renderPipes(scrollI, dt);
  updateLayers(scrollI, timeI);

  // Giorno/notte graduale
  if (night !== nightTarget) night = approach(night, nightTarget, dt / 2.5);
  if (night !== envApplied) applyEnvironment(night);

  // Scossone della camera
  if (shake.t < shake.dur) {
    shake.t += dt;
    const k = Math.max(0, 1 - shake.t / shake.dur), amp = shake.amp * k * k;
    camera.position.set(cam.base.x + (Math.random() * 2 - 1) * amp, cam.base.y + (Math.random() * 2 - 1) * amp, cam.base.z);
  } else {
    camera.position.copy(cam.base);
  }

  renderer.render(scene, camera);
}
</script>
